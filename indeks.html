<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPK Flashdisk SAW</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Animated Background Shapes -->
<div class="bg-shape shape-1"></div>
<div class="bg-shape shape-2"></div>
<div class="bg-shape shape-3"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-dark shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="fa-solid fa-bolt text-warning me-2"></i>SPK Flashdisk SAW
        </span>
    </div>
</nav>

<div class="container py-5">

    <!-- HEADER CARD -->
    <div class="card glass p-5 mb-5 text-center hero-card">
        <h2 class="fw-bold mb-3">Sistem Pendukung Keputusan</h2>
        <p class="text-muted fs-5 mb-0">Pemilihan Flashdisk Terbaik Menggunakan Metode Simple Additive Weighting (SAW)</p>
    </div>

    <!-- INPUT SECTION -->
    <div class="card glass p-4 mb-5">
        <h5 class="mb-4 fw-semibold border-bottom border-secondary pb-3">
            <i class="fa-solid fa-plus-circle me-2 text-primary"></i>Input Data Flashdisk
        </h5>

        <div class="row g-3 align-items-end">

            <div class="col-md-3">
                <label class="form-label text-light fs-7 mb-1">Nama Flashdisk</label>
                <input type="text" id="nama" class="form-control shadow-none" placeholder="Masukkan Nama">
            </div>

            <div class="col-md-2">
                <label class="form-label text-light fs-7 mb-1">Harga (Rp)</label>
                <input type="number" id="harga" class="form-control shadow-none" placeholder="Contoh: 150000">
            </div>

            <div class="col-md-2">
                <label class="form-label text-light fs-7 mb-1">Kapasitas (GB)</label>
                <input type="number" id="kapasitas" class="form-control shadow-none" placeholder="Contoh: 32">
            </div>

            <div class="col-md-2">
                <label class="form-label text-light fs-7 mb-1">Kecepatan (MB/s)</label>
                <input type="number" id="kecepatan" class="form-control shadow-none" placeholder="Contoh: 100">
            </div>

            <div class="col-md-2">
                <label class="form-label text-light fs-7 mb-1">Garansi (Tahun)</label>
                <input type="number" id="garansi" class="form-control shadow-none" placeholder="Contoh: 5">
            </div>

            <div class="col-md-1 mt-4 mt-md-0">
                <button class="btn btn-primary w-100 h-100 d-flex align-items-center justify-content-center py-2" onclick="tambahData()" title="Tambah Data">
                    <i class="fa-solid fa-plus fs-5"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- DATA TABLE -->
    <div class="card glass p-4 mb-5">
        <h5 class="mb-4 fw-semibold border-bottom border-secondary pb-3">
            <i class="fa-solid fa-database me-2 text-info"></i>Data Flashdisk
        </h5>

        <div class="table-responsive">
            <table class="table table-hover align-middle custom-table">
                <thead class="table-dark">
                    <tr>
                        <th>Nama</th>
                        <th>Harga</th>
                        <th>Kapasitas</th>
                        <th>Kecepatan</th>
                        <th>Garansi</th>
                        <th class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <!-- Data will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- BUTTON HITUNG -->
    <div class="text-center mb-5">
        <button class="btn btn-success btn-lg px-5 shadow pulse-button" onclick="hitungSAW()">
            <i class="fa-solid fa-calculator me-2"></i>Hitung SAW
        </button>
    </div>

    <!-- RESULT -->
    <div class="card glass p-4 mb-4">
        <h5 class="mb-4 fw-semibold border-bottom border-secondary pb-3">
            <i class="fa-solid fa-trophy me-2 text-warning"></i>Hasil Ranking
        </h5>

        <div class="table-responsive">
            <table class="table table-striped align-middle custom-table">
                <thead class="table-dark">
                    <tr>
                        <th>Rank</th>
                        <th>Nama</th>
                        <th>Nilai Preferensi</th>
                    </tr>
                </thead>
                <tbody id="rankingTable">
                    <!-- Results will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
